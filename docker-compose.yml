version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL Database (Phase 13)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: aml_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aml_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aml_password}
      POSTGRES_DB: ${POSTGRES_DB:-aml_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aml_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend (Phases 1-13, 15)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aml_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aml_user}:${POSTGRES_PASSWORD:-aml_password}@db:5432/${POSTGRES_DB:-aml_db}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production_compliance_key_2026}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RISK_WEIGHT_ML: 0.40
      RISK_WEIGHT_ANOMALY: 0.20
      RISK_WEIGHT_RULES: 0.20
      RISK_WEIGHT_NETWORK: 0.20
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ./ml/data:/app/ml/data:ro

  # ---------------------------------------------------------------------------
  # React Investigator Dashboard (Phase 14)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aml_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
